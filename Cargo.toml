[package]
name = "ssmver"
version = "0.5.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
once_cell = "1.21"
regex = "1.11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
xmltree = "0.11"

[dev-dependencies]
tempfile = "3.15"
